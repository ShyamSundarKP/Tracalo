<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>Tracalo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<style>
:root{
  --bg:#f5f3ee;--card:#fff;--ink:#1d1c1a;--mut:#7a766d;--line:#ebe7de;
  --cal:#ff6a3d;--cal-soft:#ffe8df;--pro:#2f7bff;--pro-soft:#e2edff;--ok:#1f9d6b;--bad:#d6402f;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1b19;--ink:#f3f0ea;--mut:#a09b90;--line:#2c2a27;--cal-soft:#3a2219;--pro-soft:#15243f;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1b19;--ink:#f3f0ea;--mut:#a09b90;--line:#2c2a27;--cal-soft:#3a2219;--pro-soft:#15243f;--shadow:0 1px 2px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em;margin:2px 0 6px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:6px}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.date{font-weight:700;font-size:20px;min-width:130px;text-align:center}
.date small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.pills{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:14px}
.rings{position:relative;width:170px;height:170px;flex:none}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round;stroke-width:13}
.track{stroke:var(--line)}
.r-cal{stroke:var(--cal);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .3s}
.r-pro{stroke:var(--pro);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1) .08s}
.r-cal.over{stroke:var(--bad)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.center b{font-size:30px;line-height:1}
.center span{font-size:11px;color:var(--mut);margin-top:3px}
.stats{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.stat{border-radius:16px;padding:10px 12px}
.stat.c{background:var(--cal-soft)}.stat.p{background:var(--pro-soft)}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font-size:22px;font-weight:700}
.stat.c .v{color:var(--cal)}.stat.p .v{color:var(--pro)}
.stat .g{font-size:12px;color:var(--mut)}
h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 92px;gap:8px}
input{font:inherit;font-size:16px;width:100%;padding:12px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--cal)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--mut);font-size:13px;padding:8px 0 0;cursor:pointer;text-decoration:underline}
.manual{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.manual.show{display:grid}
.msg{font-size:13px;margin-top:8px;color:var(--mut)}
.msg.err{color:var(--bad)}
.item{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--cal),var(--pro));flex:none}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n small{color:var(--mut);font-size:12px}
.item .n small a{color:var(--mut)}
.chip{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.c{background:var(--cal-soft);color:var(--cal)}
.chip.p{background:var(--pro-soft);color:var(--pro)}
.tag{font-size:10px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:0 4px;margin-left:5px;vertical-align:middle}
.empty{text-align:center;color:var(--mut);padding:18px 0 6px}
.empty svg{width:84px;height:84px;display:block;margin:0 auto 6px}
.shimmer{animation:sh 1.1s ease-in-out infinite}
@keyframes sh{50%{opacity:.4}}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:104px;position:relative;padding-top:6px}
.goalline{position:absolute;left:0;right:0;bottom:94px;border-top:1.5px dashed var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:1}
.pair{display:flex;align-items:flex-end;gap:3px;height:82px}
.bar{width:9px;border-radius:5px 5px 2px 2px;min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar.c{background:var(--cal)}.bar.p{background:var(--pro)}
.col span{font-size:11px;color:var(--mut);margin-top:4px;height:14px}
.col.sel span{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h4{margin:0 0 12px;font-size:18px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts button{flex:1;padding:12px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.sheet .acts .pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet .acts .del{color:var(--bad)}
.sheet .src{font-size:13px;margin-top:12px;color:var(--mut);word-break:break-word}
.sheet .src a{color:var(--pro)}
.frow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow div{flex:1;min-width:0}
.frow small{display:block;color:var(--mut);font-size:12px}
.frow button{border:0;background:none;color:var(--bad);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" width="26" height="26"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--cal)" stroke-width="4"/><circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--pro)" stroke-width="4"/></svg><span>Tracalo</span></div>
  <header>
    <div class="nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="date" id="dateLabel"></div>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <div class="pills"><button class="pill" id="foodsBtn">Foods</button><button class="pill" id="goalBtn">Goals</button></div>
  </header>

  <section class="card hero">
    <div class="rings">
      <svg viewBox="0 0 180 180">
        <circle class="track" cx="90" cy="90" r="74"/><circle class="track" cx="90" cy="90" r="54"/>
        <circle class="r-cal" id="rc" cx="90" cy="90" r="74"/><circle class="r-pro" id="rp" cx="90" cy="90" r="54"/>
      </svg>
      <div class="center"><b id="pct">0%</b><span>of calorie goal</span></div>
    </div>
    <div class="stats">
      <div class="stat c"><div class="l">Calories</div><div class="v"><span id="tc">0</span> <small style="font-size:12px;font-weight:500">kcal</small></div><div class="g" id="gc"></div></div>
      <div class="stat p"><div class="l">Protein</div><div class="v"><span id="tp">0</span> <small style="font-size:12px;font-weight:500">g</small></div><div class="g" id="gp"></div></div>
    </div>
  </section>

  <section class="card">
    <h3>Add food</h3>
    <div class="row2">
      <input id="fname" placeholder="Food, e.g. egg, milk, oats" autocomplete="off" enterkeyhint="next">
      <input id="fqty" placeholder="80 g" autocomplete="off" enterkeyhint="go">
    </div>
    <div class="chips" id="chips"></div>
    <div class="manual" id="manual">
      <input id="mc" type="number" inputmode="decimal" placeholder="kcal">
      <input id="mp" type="number" inputmode="decimal" placeholder="protein g">
    </div>
    <button class="btn" id="addBtn">Add</button>
    <button class="link" id="manBtn">Enter values manually</button>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h3 id="listTitle">Today's log</h3>
    <div id="items"></div>
  </section>

  <section class="card">
    <h3>Last 7 days</h3>
    <div class="bars" id="bars"></div>
    <div class="legend"><span><i style="background:var(--cal)"></i>Calories</span><span><i style="background:var(--pro)"></i>Protein</span><span>dashed = goal</span></div>
  </section>

  <div class="foot">Values come from a live web search (≈ = midpoint of the range found). Tap "verify" on any item to open the same Google search.</div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="/static/logic.js"></script>
<script>
(function(){
  var KEY='tracalo-v1', TK='tracalo-token', LG=window.Logic;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var dkey=function(d){return d.toLocaleDateString('en-CA')};
  var fmt=function(n){return Math.round(n*10)/10};
  var gurl=function(q){return 'https://www.google.com/search?q='+encodeURIComponent(q)};
  var fresh=function(){return{goals:{cal:2200,pro:120},days:{},foods:{}}};
  function norm(s){s=s&&typeof s==='object'?s:fresh();s.goals=s.goals||{cal:2200,pro:120};s.days=s.days||{};s.foods=s.foods||{};return s}
  var state;
  try{state=norm(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('macro-log-v2')))}catch(e){state=fresh()}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  var offset=0,pending=null,busy=false;
  function curDate(){var d=new Date();d.setHours(12);d.setDate(d.getDate()+offset);return d}
  function items(k){return state.days[k]||[]}
  function sums(k){return items(k).reduce(function(a,i){a.c+=+i.cal||0;a.p+=+i.pro||0;return a},{c:0,p:0})}
  var C1=2*Math.PI*74,C2=2*Math.PI*54;
  function ring(el,C,f){el.style.strokeDasharray=C;el.style.strokeDashoffset=C*(1-Math.max(0,Math.min(f,1)))}

  function render(){
    var d=curDate(),k=dkey(d),t=sums(k),g=state.goals;
    var label=offset===0?'Today':offset===-1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'long'});
    $('#dateLabel').innerHTML=esc(label)+'<small>'+esc(d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}))+'</small>';
    $('#next').disabled=offset>=0;
    $('#listTitle').textContent=(offset===0?"Today's":"This day's")+' log';
    $('#tc').textContent=Math.round(t.c);$('#tp').textContent=fmt(t.p);
    var rc=g.cal-t.c,rp=g.pro-t.p;
    $('#gc').textContent=(rc>=0?Math.round(rc)+' left':Math.round(-rc)+' over')+' · goal '+g.cal;
    $('#gp').textContent=(rp>=0?fmt(rp)+' g to go':'goal hit ✓')+' · goal '+g.pro+' g';
    $('#pct').textContent=Math.round(g.cal?t.c/g.cal*100:0)+'%';
    ring($('#rc'),C1,g.cal?t.c/g.cal:0);ring($('#rp'),C2,g.pro?t.p/g.pro:0);
    $('#rc').classList.toggle('over',t.c>g.cal);

    var h='';
    items(k).forEach(function(i){
      var sub=esc(i.qty||'');
      if(i.rng)sub+=' · '+esc(i.rng);
      if(i.q&&!i.saved)sub+=' · <a href="'+esc(gurl(i.q))+'" target="_blank" rel="noopener">verify</a>';
      h+='<div class="item" data-id="'+esc(i.id)+'"><span class="dot"></span><div class="n"><b>'+esc(i.name)+(i.saved?'<span class="tag">saved</span>':'')+'</b><small>'+sub+'</small></div>'+
        '<span class="chip c">'+(i.est?'≈ ':'')+Math.round(i.cal)+' kcal</span><span class="chip p">'+(i.est?'≈ ':'')+fmt(i.pro)+' g</span></div>';
    });
    if(pending&&pending.key===k)h+='<div class="item shimmer"><span class="dot"></span><div class="n"><b>'+esc(pending.name)+'</b><small>Searching: '+esc(pending.qty)+'…</small></div></div>';
    if(!h)h='<div class="empty"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="34" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="48" cy="48" r="22" fill="var(--cal-soft)"/><path d="M14 20v20M20 20v20M26 20v20M20 40v36M78 20c-6 6-8 16-8 28h8v28" fill="none" stroke="var(--mut)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Nothing logged yet.<br>Add your first meal above.</div>';
    $('#items').innerHTML=h;

    var bars='<div class="goalline"></div>';
    for(var n=6;n>=0;n--){
      var dd=new Date();dd.setHours(12);dd.setDate(dd.getDate()-n);
      var kk=dkey(dd),s=sums(kk);
      var hc=Math.min(g.cal?s.c/g.cal:0,1.3)*76,hp=Math.min(g.pro?s.p/g.pro:0,1.3)*76;
      bars+='<div class="col'+(kk===k?' sel':'')+'"><div class="pair"><div class="bar c" style="height:'+hc+'px"></div><div class="bar p" style="height:'+hp+'px"></div></div><span>'+esc(dd.toLocaleDateString(undefined,{weekday:'narrow'}))+'</span></div>';
    }
    $('#bars').innerHTML=bars;

    var names=Object.keys(state.foods).map(function(f){return state.foods[f].name});
    names=names.filter(function(n,i){return names.indexOf(n)===i}).slice(-8).reverse();
    $('#chips').innerHTML=names.map(function(n){return '<button data-n="'+esc(n)+'">'+esc(n)+'</button>'}).join('');
  }

  // ---- sheets ----
  function openSheet(html){$('#sheet').innerHTML=html;$('#ov').classList.add('show')}
  function closeSheet(){$('#ov').classList.remove('show')}
  $('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet()});

  $('#goalBtn').onclick=function(){
    openSheet('<h4>Daily goals</h4><div class="g2"><div><label>Calories (kcal)</label><input id="gcal" type="number" inputmode="numeric" value="'+state.goals.cal+'"></div><div><label>Protein (g)</label><input id="gpro" type="number" inputmode="numeric" value="'+state.goals.pro+'"></div></div><div class="acts"><button id="sCancel">Cancel</button><button class="pri" id="sSave">Save</button></div>');
    $('#sCancel').onclick=closeSheet;
    $('#sSave').onclick=function(){var c=+$('#gcal').value,p=+$('#gpro').value;if(c>0)state.goals.cal=c;if(p>0)state.goals.pro=p;persist();closeSheet();render()};
  };

  function basisLabel(f){
    if(f.t==='g'||f.t==='ml')return fmt(f.cal1*100)+' kcal · '+fmt(f.pro1*100)+' g protein per 100 '+f.t;
    var u=f.t==='count'?'piece':f.t.slice(2);
    return fmt(f.cal1)+' kcal · '+fmt(f.pro1)+' g protein per '+u;
  }
  $('#foodsBtn').onclick=function(){
    var keys=Object.keys(state.foods),h='<h4>Saved foods</h4>';
    if(!keys.length)h+='<div class="msg">Nothing saved yet. Every successful search is saved and reused next time, with no new search.</div>';
    keys.forEach(function(k){var f=state.foods[k];h+='<div class="frow"><div><b>'+esc(f.name)+'</b><small>'+esc(basisLabel(f))+'</small></div><button data-k="'+esc(k)+'">Delete</button></div>'});
    h+='<div class="acts"><button id="sClose" class="pri">Done</button></div>';
    openSheet(h);
    $('#sClose').onclick=closeSheet;
    $('#sheet').onclick=function(e){var b=e.target.closest('button[data-k]');if(!b)return;delete state.foods[b.dataset.k];persist();render();$('#foodsBtn').onclick()};
  };
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('button[data-n]');if(!b)return;$('#fname').value=b.dataset.n;$('#fqty').focus()});

  $('#items').addEventListener('click',function(e){
    if(e.target.closest('a'))return;
    var el=e.target.closest('.item[data-id]');if(!el)return;
    var k=dkey(curDate()),it=items(k).find(function(x){return x.id===el.dataset.id});if(!it)return;
    var src='';
    if(it.q)src+='<div class="src">Search: <a href="'+esc(gurl(it.q))+'" target="_blank" rel="noopener">'+esc(it.q)+'</a></div>';
    if(it.basis)src+='<div class="src">'+esc(it.basis)+'</div>';
    (it.src||[]).forEach(function(s){src+='<div class="src"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a></div>'});
    openSheet('<h4>Edit item</h4><label>Food</label><input id="en" value="'+esc(it.name)+'"><label>Quantity</label><input id="eq" value="'+esc(it.qty||'')+'"><div class="g2"><div><label>Calories (kcal)</label><input id="ec" type="number" inputmode="decimal" value="'+esc(it.cal)+'"></div><div><label>Protein (g)</label><input id="ep" type="number" inputmode="decimal" value="'+esc(it.pro)+'"></div></div>'+src+'<div class="acts"><button class="del" id="eDel">Delete</button><button id="eCancel">Cancel</button><button class="pri" id="eSave">Save</button></div>');
    $('#eCancel').onclick=closeSheet;
    $('#eDel').onclick=function(){state.days[k]=items(k).filter(function(x){return x.id!==it.id});persist();closeSheet();render()};
    $('#eSave').onclick=function(){
      var c=+$('#ec').value,p=+$('#ep').value;
      if(!(isFinite(c)&&c>=0&&isFinite(p)&&p>=0))return;
      var changed=c!==+it.cal||p!==+it.pro;
      it.name=$('#en').value.trim()||it.name;it.qty=$('#eq').value.trim();it.cal=c;it.pro=p;
      if(changed){it.est=false;it.rng='edited'}
      var pq=LG.parseQty(it.qty);
      if(changed&&pq&&it.fk){ // corrected values also fix the saved basis
        var fk=LG.foodKey(it.name,pq.t),b=LG.basisFrom(c,p,pq.n);
        state.foods[fk]=Object.assign(state.foods[fk]||{name:it.name,t:pq.t},b,{name:it.name,t:pq.t});
        it.fk=fk;
      }
      persist();closeSheet();render();
    };
  });

  // ---- add ----
  function setMsg(t,err){var m=$('#msg');m.textContent=t||'';m.className='msg'+(err?' err':'')}
  $('#manBtn').onclick=function(){var m=$('#manual');m.classList.toggle('show');$('#manBtn').textContent=m.classList.contains('show')?'Use search instead':'Enter values manually'};
  $('#fname').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('#fqty').focus()}});
  $('#fqty').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add()}});
  $('#addBtn').onclick=add;

  function push(k,o){o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);(state.days[k]=state.days[k]||[]).push(o);persist();render()}
  function clearInputs(){$('#fname').value='';$('#fqty').value='';$('#mc').value='';$('#mp').value=''}

  function askToken(){
    return new Promise(function(res,rej){
      openSheet('<h4>Access token</h4><div class="msg">Enter the APP_TOKEN set on your server.</div><input id="tk" type="password" autocomplete="off"><div class="acts"><button id="tC">Cancel</button><button class="pri" id="tS">Save</button></div>');
      $('#tC').onclick=function(){closeSheet();rej({status:401})};
      $('#tS').onclick=function(){localStorage.setItem(TK,$('#tk').value.trim());closeSheet();res()};
    });
  }
  async function callLookup(name,qty){
    for(var a=0;a<2;a++){
      var r=await fetch('/api/lookup',{method:'POST',headers:{'Content-Type':'application/json','x-app-token':localStorage.getItem(TK)||localStorage.getItem('macro-log-token')||''},body:JSON.stringify({name:name,qty:qty})});
      if(r.status===401&&a===0){await askToken();continue}
      if(!r.ok){var d=await r.json().catch(function(){return{}});throw{status:r.status,msg:d.detail||''}}
      return r.json();
    }
  }

  async function add(){
    if(busy)return;
    var name=$('#fname').value.trim(),qty=$('#fqty').value.trim();
    if(!name){setMsg('Enter a food name.',true);return}
    if(!qty){setMsg('Enter a quantity: 80 g, 250 ml, or just 2 for 2 eggs.',true);return}
    var k=dkey(curDate()),pq=LG.parseQty(qty),mc=$('#mc').value,mp=$('#mp').value;
    setMsg('');
    if($('#manual').classList.contains('show')&&mc!==''&&mp!==''){
      push(k,{name:name,qty:qty,cal:Math.max(0,+mc),pro:Math.max(0,+mp),est:false,rng:'manual'});clearInputs();return;
    }
    if(pq){
      var fk=LG.foodKey(name,pq.t),f=state.foods[fk];
      if(f){var v=LG.scale(f,pq.n);push(k,{name:name,qty:qty,cal:v.cal,pro:v.pro,est:true,saved:true,fk:fk,rng:'from saved food'});clearInputs();return}
    }
    busy=true;$('#addBtn').disabled=true;pending={key:k,name:name,qty:qty};render();
    try{
      var r=await callLookup(name,qty);
      pending=null;
      var o={name:name,qty:qty,cal:r.cal,pro:r.pro,est:true,q:r.query,src:r.sources,basis:r.basis,
        rng:(r.cal_range[0]===r.cal_range[1]?'':r.cal_range[0]+'–'+r.cal_range[1]+' kcal, ')+(r.pro_range[0]===r.pro_range[1]?'':r.pro_range[0]+'–'+r.pro_range[1]+' g')};
      if(!o.rng.replace(/[, ]/g,''))o.rng='';
      if(pq){var key=LG.foodKey(name,pq.t);state.foods[key]=Object.assign({name:name,t:pq.t,q:r.query},LG.basisFrom(r.cal,r.pro,pq.n));o.fk=key}
      push(k,o);clearInputs();
    }catch(e){
      pending=null;render();
      var t='Search failed. Try again, or enter values manually.';
      if(e&&e.status===401)t='Access token rejected.';
      else if(e&&e.status===404)t='No usable numbers found for that. Try a clearer name, or enter values manually.';
      else if(e&&e.status===502)t='Backend error: '+(e.msg||'unknown');
      else if(e instanceof TypeError)t='Cannot reach the server.';
      setMsg(t,true);
    }finally{busy=false;$('#addBtn').disabled=false}
  }

  $('#prev').onclick=function(){offset--;render()};
  $('#next').onclick=function(){if(offset<0){offset++;render()}};
  render();
})();
</script>
